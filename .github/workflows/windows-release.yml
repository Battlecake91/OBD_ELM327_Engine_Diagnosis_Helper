name: Windows executable and release

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.1.0"
        required: true
        default: "v3.1.0"
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: python -m pytest

      - name: Build single-file executable
        shell: pwsh
        run: .\build_windows.ps1 -SkipInstall

      - name: Upload unsigned Windows build
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-x64
          path: |
            dist/OBD_ELM327_Engine_Diagnosis_Helper.exe
            dist/OBD_ELM327_Engine_Diagnosis_Helper.sha256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: windows-build.log
          if-no-files-found: warn
          retention-days: 14

  sign-and-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: windows-latest
    environment: artifact-signing
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Download unsigned executable
        uses: actions/download-artifact@v4
        with:
          name: unsigned-windows-x64
          path: dist

      - name: Validate Artifact Signing configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
        shell: pwsh
        run: |
          $Required = @{
              "AZURE_CLIENT_ID" = $env:AZURE_CLIENT_ID
              "AZURE_TENANT_ID" = $env:AZURE_TENANT_ID
              "AZURE_SUBSCRIPTION_ID" = $env:AZURE_SUBSCRIPTION_ID
              "ARTIFACT_SIGNING_ENDPOINT" = $env:ARTIFACT_SIGNING_ENDPOINT
              "ARTIFACT_SIGNING_ACCOUNT_NAME" = $env:ARTIFACT_SIGNING_ACCOUNT_NAME
              "ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME" = $env:ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME
          }

          $Missing = @($Required.GetEnumerator() | Where-Object {
              [string]::IsNullOrWhiteSpace([string]$_.Value)
          } | ForEach-Object Key)

          if ($Missing.Count -gt 0) {
              throw "Missing Artifact Signing configuration: $($Missing -join ', ')"
          }

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign executable with Microsoft Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\dist\OBD_ELM327_Engine_Diagnosis_Helper.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $ExePath = "dist\OBD_ELM327_Engine_Diagnosis_Helper.exe"
          $Signature = Get-AuthenticodeSignature -FilePath $ExePath
          $Signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate

          if ($Signature.Status -ne "Valid") {
              throw "Authenticode signature verification failed: $($Signature.Status) - $($Signature.StatusMessage)"
          }

      - name: Generate checksum for signed executable
        shell: pwsh
        run: |
          $ExePath = "dist\OBD_ELM327_Engine_Diagnosis_Helper.exe"
          $HashPath = "dist\OBD_ELM327_Engine_Diagnosis_Helper.sha256.txt"
          $Hash = (Get-FileHash -Path $ExePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  OBD_ELM327_Engine_Diagnosis_Helper.exe" | Set-Content -Path $HashPath -Encoding ascii

      - name: Upload signed Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: OBD_ELM327_Engine_Diagnosis_Helper-windows-x64-signed
          path: |
            dist/OBD_ELM327_Engine_Diagnosis_Helper.exe
            dist/OBD_ELM327_Engine_Diagnosis_Helper.sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        shell: pwsh
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
              $Tag = $env:INPUT_TAG.Trim()
              $Prerelease = $env:INPUT_PRERELEASE
          } else {
              $Tag = $env:REF_NAME
              $Prerelease = "false"
          }

          if ([string]::IsNullOrWhiteSpace($Tag)) {
              throw "A release tag is required."
          }

          "tag=$Tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$Prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: pwsh
        run: |
          $Files = @(
              "dist/OBD_ELM327_Engine_Diagnosis_Helper.exe",
              "dist/OBD_ELM327_Engine_Diagnosis_Helper.sha256.txt"
          )

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $env:RELEASE_TAG @Files --clobber --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Uploading release assets failed." }
              exit 0
          }

          $Arguments = @(
              "release", "create", $env:RELEASE_TAG,
              "--repo", $env:GITHUB_REPOSITORY,
              "--target", $env:GITHUB_SHA,
              "--title", "ELM327 Live Diagnostic $env:RELEASE_TAG",
              "--generate-notes"
          ) + $Files

          if ($env:RELEASE_PRERELEASE -eq "true") {
              $Arguments += "--prerelease"
          }

          & gh @Arguments
          if ($LASTEXITCODE -ne 0) { throw "Creating the GitHub release failed." }
